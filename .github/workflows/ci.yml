name: Check waterfall
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        lean: [v4.30.0, v4.33.1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Select Lean version for this check
        env:
          TEST_LEAN: ${{ matrix.lean }}
        run: |
          printf 'leanprover/lean4:%s\n' "$TEST_LEAN" > lean-toolchain
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "true"
          use-mathlib-cache: "false"
      - name: Build documentation tooling
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: site
          build: "true"
          test: "false"
          use-mathlib-cache: "false"
      - run: lake exe site check-docs
        working-directory: site
      - run: lake env leanchecker Tutorial.Examples

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: site
          build: "true"
          test: "true"
          use-mathlib-cache: "false"
      - run: lake exe site check
        working-directory: site
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, website]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
