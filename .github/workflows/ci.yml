name: Check Waterfall
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        lean: [v4.30.0, v4.33.1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r site/requirements.txt
      - name: Select Lean version for this check
        env:
          TEST_LEAN: ${{ matrix.lean }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ['lean-toolchain', 'consumer/lean-toolchain']:
              Path(name).write_text('leanprover/lean4:' + os.environ['TEST_LEAN'] + '\n')
          PY
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "true"
          use-mathlib-cache: "false"
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/size.py
      - run: lake env leanchecker Docs.Examples
      - run: lake build
        working-directory: consumer
      - run: lake env leanchecker Consumer
        working-directory: consumer

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r site/requirements.txt
      - run: python3 scripts/check_site.py
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, website]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
